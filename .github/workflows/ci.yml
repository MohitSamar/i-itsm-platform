name: I-ITSM Full-Stack CI Pipeline

on:
  push:
    branches: [ "main", "develop", "feat/**" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-junit-tests:
    name: Java 21 OOP & JUnit 5 Suite (16 Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Execute JUnit 5 Domain, Pattern & Intelligence Tests
        working-directory: ./backend
        run: ./mvnw test -B

  frontend-build:
    name: React 18 + TypeScript Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install & Build Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build
