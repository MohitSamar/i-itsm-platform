server.port=8080
spring.application.name=I-ITSM

# PostgreSQL Connection (matches docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/iitsm_db
spring.datasource.username=iitsm_admin
spring.datasource.password=iitsm_secret_password

# JPA / Hibernate auto-schema generation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
