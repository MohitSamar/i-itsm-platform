services:
  postgres:
    image: postgres:16-alpine
    container_name: iitsm-postgres
    environment:
      POSTGRES_DB: iitsm_db
      POSTGRES_USER: iitsm_admin
      POSTGRES_PASSWORD: iitsm_secret_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
